[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/rbac.py",
    "backend/secret_manager.py",
    "backend/pii_redaction.py",
    "backend/logging_config.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = [
    "backend/rbac.py",
    "backend/secret_manager.py",
    "backend/pii_redaction.py",
    "backend/logging_config.py",
]